<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine? ❤️</title>

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #F1E6E6;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .box {
      text-align: center;
      position: relative;
    }

    h1 {
      color: #E6005C;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yes {
      background-color: #FF4D79;
      color: white;
    }

    #no {
      background-color: #999;
      color: white;
      position: absolute;
    }

    #gif {
      display: none;
      width: 200px;
      margin-top: 20px;
    }

    /* Her Photo Style */
    #herPhoto {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #FF4D79;
      margin-bottom: 15px;
    }
  </style>
</head>
